<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revisão</title>

    <link css rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <!--Tag table-->
    <table>
        <!-- Título da tabela -->
        <caption>
    Tabela de produtos
        </caption>
        <!-- Cabeçalho da tabela -->
        <thead>
            <tr>
                <!--Theader-->
                <th>Produtos</th>
                <th>Preço</th>
            </tr>
        </thead>
        <!-- Corpo da tabela -->
        <tbody
            <tr>
            
            </tr>
                <td>Arroz</td>
                <td>R$ 29,99</td>
            </tr>
            <tr>
                <td>Feijão</td>
                <td>R$ 11,00</td>
            </tr>
            <tr>
                <td>Café</td>
                <td>R$ 26,99</td>
            </tr>
        </tbody>
        <!-- Rodapé da tabela -->
        <tfoot>
            <tr>
                <td>Total de produtos</td>
                <td>R$ 66,99</td>
            </tr>
        </tfoot>
    </table>
  </body>
</html>
