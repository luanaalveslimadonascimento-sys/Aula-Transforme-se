<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>

    <!-- Formulários -->
     <form action="" method="get"></form>
       <fieldset>
        <legend>Dados Pessoais</legend>
           <label for="nome">Nome:</label>
           <input type="text" name="nome" id="nome" required minlength="2" maxlength="10" placeholder="Digite seu nome" /> <br />
           <label for="email">Email:</label>
           <input type="email" id="email" name="email" placeholder="Digite seu email" />
           <br />
           <label for="numero">Número:</label>
           <input type="text" name="numero" id="numero" step="1" required min="0" max="10" />
           <br />
           <label for="senha">Senha:</label>
           <input type="password" name="senha" id="senha" required minlength="8" maxlength="10" /> <br />
           <label for="checkbox">Aceita os termos?</label>
           <input type="checkbox" name="checkbox" id="checkbox" /> <br />
          
           <label for="contaP">Conta Pessoal</label>
          <input type="radio" name="conta" id="contaP"> Sim
         
          <label for="contaJ"> </label>
          <input type="radio" name="conta" id="contaJ"> Não
           <p>
           <input type="submit" value="Enviar" />
           <input type="reset" value="Limpar" />
           </p>
       </fieldset>
     </form>
  </body>
</html>
